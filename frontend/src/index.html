<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Shiny To-Do List</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>
  <div class="container">
    <h1>Görev Takip 📝</h1>

    <div class="input-group">
      <input id="taskInput" placeholder="Yeni görev ekle..." />
      <button id="addBtn"><i class="fas fa-plus"></i></button>
    </div>

    <div class="action-buttons">
      <button id="loadBtn"><i class="fas fa-folder-open"></i> Görevleri Aç</button>
      <button id="saveBtn"><i class="fas fa-save"></i> Görevleri Kaydet</button>
      <button id="toggleThemeBtn"><i class="fas fa-moon"></i> Tema</button>
    </div>

    <ul id="taskList"></ul>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
